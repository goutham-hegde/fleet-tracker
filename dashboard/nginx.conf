# Serving configuration for the built dashboard. Deliberately short: this server holds no logic,
# because everything a person can do on this page goes through an API on another port.

server {
    # 8080, matching the unprivileged nginx image. Kubernetes maps this to the host's 18080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A health endpoint that does not depend on a file existing. The readiness probe asks for this
    # rather than for `/`, so a container whose assets failed to copy reports itself unready
    # instead of serving a 404 page to everybody who opens the dashboard.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every built asset (`index-a1b2c3d4.js`), so the file name changes whenever
    # its content does and a year of caching can never serve a stale one. `index.html` is the one
    # file that keeps its name, so it must never be cached: a browser holding yesterday's copy
    # would ask for asset names that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        # The dashboard is a single page with no router today, but `try_files` is what keeps a
        # deep link working the moment it gets one: the server answers any unknown path with the
        # application, and the application decides what that path means.
        try_files $uri $uri/ /index.html;
    }
}
