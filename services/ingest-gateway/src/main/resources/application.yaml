spring:
  application:
    name: ingest-gateway

  # spring.mongodb, NOT spring.data.mongodb. Spring Boot 4 moved the connection properties out of
  # Spring Data's namespace and deprecated the old names at level "error", which means they are no
  # longer bound -- silently. A file using the 3.x names starts perfectly and connects to the
  # default mongodb://localhost/test, which on this machine is an unrelated mongod that answers.
  mongodb:
    # 37017 on the host, not 27017: that unrelated mongod owns the default port. Inside the cluster
    # this is overridden to mongodb://mongodb.fleet.svc.cluster.local:27017.
    uri: mongodb://localhost:37017
    database: fleet

  kafka:
    # 19092 on the host, not 9092: this machine already has something on the default port, and the
    # Kind cluster publishes the broker on a non-default one for the same reason. Inside the
    # cluster this is overridden to kafka.fleet.svc.cluster.local:9092.
    bootstrap-servers: localhost:19092
    producer:
      # Strings both sides. The value is already JSON produced by EventJson, and a JSON serializer
      # would build its own ObjectMapper -- a second, differently configured one, which is exactly
      # what having a single EventJson exists to prevent.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Every in-sync replica must acknowledge before a send completes. Locally there is one broker
      # so this is free; it is set here rather than in an overlay so that the durability the
      # gateway promises its producers does not quietly depend on which environment it runs in.
      acks: all
      properties:
        # Retry a transient broker error without letting a retry reorder a partition. Idempotence
        # makes the broker discard a duplicate produced by a retry, which is what allows retries and
        # per-shipment ordering to coexist.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 5000

server:
  # 8080 is taken on this machine; the whole project uses non-default host ports.
  port: 18081

fleet:
  gateway:
    # Comfortably inside delivery.timeout.ms above, so the producer gives up before this does and
    # the failure surfaces as a broker error rather than as an unexplained timeout.
    send-timeout: 15s

    # Identity resolution reads dispatch reference data from the assignments collection in the
    # database configured above. It used to be a list here; a list cannot say when an assignment
    # starts or ends, and every feed needs that. Seed the collection with scripts/seed-identity.sh.

management:
  endpoints:
    web:
      exposure:
        # Health only, plus the build/version information the dashboard of a real deployment would
        # read. Actuator can expose a great deal more -- environment, configuration properties,
        # thread dumps -- and every one of those is a way to read this service's configuration over
        # HTTP. Exposure is opt-in for that reason, and this list is the whole of it.
        include: health,info

  endpoint:
    health:
      # Splits health into two endpoints with two different meanings: /actuator/health/liveness and
      # /actuator/health/readiness. Kubernetes asks the first "should I restart this container" and
      # the second "should I send it traffic", and answering both with one number is the classic
      # way to build an outage: a database blip fails a combined health check, every pod is
      # restarted at once, and the restart storm outlasts the blip.
      probes:
        enabled: true
      # Local only. The details name the database the service actually connected to, which is what
      # makes a failing probe diagnosable with curl instead of a log dive -- and is also exactly
      # what should not be public once this is on the internet in M8.
      show-details: always
      group:
        readiness:
          # Readiness carries the dependencies this service cannot do its job without; liveness deliberately
          # carries none of them. Without MongoDB the gateway can still parse and still answer, but identity
          # resolution fails for every message, so all four feeds are dead-lettered as unresolvable while
          # the service reports itself perfectly well. Being taken out of the load balancer is far better
          # than accepting traffic it is guaranteed to reject.
          include: readinessState,mongo

logging:
  level:
    com.fleettracking: INFO
