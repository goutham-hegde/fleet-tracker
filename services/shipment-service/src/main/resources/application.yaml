spring:
  application:
    name: shipment-service

  # spring.mongodb, NOT spring.data.mongodb. Spring Boot 4 moved the connection properties out of
  # Spring Data's namespace and deprecated the old names at level "error", which means they are no
  # longer bound -- silently, leaving the default mongodb://localhost/test in place. On this
  # machine an unrelated mongod answers on that default, so the mistake does not even fail.
  mongodb:
    # 37017 on the host, not 27017: an unrelated mongod owns the default port on this machine.
    # Inside the cluster this is overridden to mongodb://mongodb.fleet.svc.cluster.local:27017.
    uri: mongodb://localhost:37017
    database: fleet

server:
  # 18082. 18080 is the dashboard and 18081 the ingest gateway; 8080 is already bound on this
  # machine by something unrelated to this project.
  port: 18082

  error:
    # A rejected manifest must say what was wrong with it, so the response body carries the
    # validation detail this service produced rather than a bare status code.
    include-message: always

fleet:
  shipment:
    # Schemas are read on every write rather than cached. The reasoning matches
    # MongoIdentityResolver in the gateway: this is reference data somebody else maintains, and a
    # cache buys one indexed lookup at the price of a window in which the service validates
    # against a schema the customer has already replaced. Accepting a manifest that the current
    # schema forbids is the exact failure this validation exists to prevent, and a write is far
    # rarer than a position fix -- there is no throughput argument for caching it here.
    cache-schemas: false

management:
  endpoints:
    web:
      exposure:
        # Health only, plus the build/version information the dashboard of a real deployment would
        # read. Actuator can expose a great deal more -- environment, configuration properties,
        # thread dumps -- and every one of those is a way to read this service's configuration over
        # HTTP. Exposure is opt-in for that reason, and this list is the whole of it.
        include: health,info

  endpoint:
    health:
      # Splits health into two endpoints with two different meanings: /actuator/health/liveness and
      # /actuator/health/readiness. Kubernetes asks the first "should I restart this container" and
      # the second "should I send it traffic", and answering both with one number is the classic
      # way to build an outage: a database blip fails a combined health check, every pod is
      # restarted at once, and the restart storm outlasts the blip.
      probes:
        enabled: true
      # Local only. The details name the database the service actually connected to, which is what
      # makes a failing probe diagnosable with curl instead of a log dive -- and is also exactly
      # what should not be public once this is on the internet in M8.
      show-details: always
      group:
        readiness:
          # Readiness carries the dependencies this service cannot do its job without; liveness deliberately
          # carries none of them. A manifest cannot be validated without the customer's schema, and the
          # schemas are in MongoDB.
          include: readinessState,mongo

logging:
  level:
    com.fleettracking: INFO
