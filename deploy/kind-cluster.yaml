# Local Kubernetes cluster for fleet-tracking.
#
# Single node on purpose: the Docker VM has ~8 GB and this cluster has to hold
# Kafka, MongoDB, five JVM services and ArgoCD. Extra nodes buy nothing here
# and cost ~500 MB each.
#
# NodePorts map straight to host ports so the dashboard, Kafka and Mongo are
# reachable from Windows without a long-lived `kubectl port-forward`.
#
# Host ports are deliberately NOT the defaults (8080 / 9092 / 27017):
#   - 8080  is taken by another service on this machine
#   - 27017 is taken by a local mongod install
# Using 18080 / 19092 / 37017 avoids the collision and, more importantly, makes
# it impossible to connect to the wrong MongoDB by accident.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fleet-tracking

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            - name: node-labels
              value: "ingress-ready=true"
      # The cluster as an identity provider AWS can trust (S21). Every service-account token the
      # API server signs carries an `iss` claim naming its issuer, and AWS will only accept a token
      # whose issuer it can reach over HTTPS to fetch the public key that verifies it. The default,
      # https://kubernetes.default.svc.cluster.local, exists only inside this cluster; this one is a
      # public S3 bucket that infra/cloud/cluster-oidc.tf creates and scripts/aws-link.sh fills with
      # this cluster's public key. The private half never leaves the node.
      #
      # Like a port mapping, this is fixed when the cluster is created, so adding it meant recreating
      # the cluster. It must match `cluster_issuer` in Terraform's outputs exactly -- a token whose
      # issuer differs by one character is refused, with a message that names neither value.
      #
      # Harmless without AWS: in-cluster clients have their tokens checked by the API server itself,
      # which accepts its own issuer whatever it is called.
      #
      # A list of name/value pairs rather than a map: Kubernetes 1.31+ uses kubeadm's v1beta4
      # configuration, which changed the shape of every extraArgs block.
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            - name: service-account-issuer
              value: https://fleet-tracker-oidc.s3.ap-south-1.amazonaws.com
            - name: service-account-jwks-uri
              value: https://fleet-tracker-oidc.s3.ap-south-1.amazonaws.com/openid/v1/jwks
    extraPortMappings:
      # dashboard            -> http://localhost:18080
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      # kafka external       -> localhost:19092
      - containerPort: 30092
        hostPort: 19092
        protocol: TCP
      # mongodb (cluster)    -> mongodb://localhost:37017
      - containerPort: 30017
        hostPort: 37017
        protocol: TCP
      # ingest-gateway       -> http://localhost:18081
      #
      # These three arrived in S17, when the services stopped being jars on the host and became
      # pods. Until then they needed no mapping: a service running on Windows was already on
      # localhost. A port mapping can only be set when the cluster is created, so adding one means
      # destroying and recreating the cluster -- which is why all three went in at once rather than
      # one per session, and why the ports are the same ones each service has answered on since it
      # was built. Nothing outside this file had to change to move a service into the cluster.
      - containerPort: 30081
        hostPort: 18081
        protocol: TCP
      # shipment-service     -> http://localhost:18082
      - containerPort: 30082
        hostPort: 18082
        protocol: TCP
      # dashboard-api        -> http://localhost:18083
      - containerPort: 30083
        hostPort: 18083
        protocol: TCP
