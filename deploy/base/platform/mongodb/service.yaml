# In-cluster address for the services: mongodb://mongodb.fleet.svc.cluster.local:27017
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fleet
  labels:
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None
  # Same reasoning as the Kafka headless service: a stable DNS name that exists
  # before the pod is ready. Mongo does not deadlock on it the way Kafka does
  # (its probe never leaves the pod), but a name that appears and disappears
  # with readiness makes restarts harder to reason about than they need to be.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
# Host access on mongodb://localhost:37017.
#
# 37017 and not 27017: a completely unrelated mongod is already running on this
# machine's 27017. Sharing the port would mean every stray mongosh, Compass
# window and misconfigured service silently reads the wrong database and looks
# like it worked.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-external
  namespace: fleet
  labels:
    app.kubernetes.io/name: mongodb
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      nodePort: 30017
