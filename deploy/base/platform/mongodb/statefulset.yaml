# MongoDB 8.0.x -- the production release line. MongoDB also ships "rapid
# releases" (8.1, 8.2, 8.3) which it explicitly does not support for
# production use, so the newest tag on Docker Hub is deliberately not the one
# running here.
#
# StatefulSet for the same reason as Kafka: the volume is the database.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: fleet
  labels:
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      securityContext:
        # The official mongo image runs as uid 999 (the `mongodb` user).
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:8.0.29-noble
          args:
            # Bind to every interface; the default binds to loopback only and
            # nothing outside the container could reach it.
            - --bind_ip_all
            # WiredTiger reserves half of *host* RAM minus 1 GB by default. It
            # reads the host's memory, not the container limit, so on this
            # machine it would try to reserve ~3 GB inside a 512Mi container
            # and be OOMKilled. Capped explicitly.
            - --wiredTigerCacheSizeGB
            - "0.25"
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
