# The dashboard: four megabytes of static files and an nginx to hand them out.
#
# The only workload in this project with no JVM in it, and the only one whose image is built from a
# Dockerfile rather than by Jib -- there is no main class to point at. It holds no logic and talks
# to nothing: everything a person can do on the page goes to the dashboard API on 18083, from the
# browser, not from here.
#
# That is worth being explicit about, because a reverse proxy in this pod would be the obvious
# alternative and was rejected. Proxying /api through nginx would put the dashboard and the API on
# one origin and make CORS disappear, at the price of routing every live position through a second
# hop that exists only to avoid a header -- and of quietly changing what localhost:18083 means,
# which is the address in this project's README, its curl examples and its integration tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fleet
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: fleet-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: fleet-tracking
    spec:
      securityContext:
        # 101 is the nginx user in the unprivileged image. The ordinary nginx image runs as root
        # because port 80 is privileged; this one listens on 8080 so it does not have to.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: dashboard
          image: ghcr.io/goutham-hegde/fleet-tracker/dashboard:0.1.0-SNAPSHOT
          ports:
            - name: http
              containerPort: 8080
          resources:
            # Two orders of magnitude below the JVMs, and this is the honest comparison: serving
            # static files is not what costs memory in this platform.
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Deliberately NOT readOnlyRootFilesystem, unlike every JVM here. nginx writes its
            # temporary bodies, its pid and its caches to several paths, and locking the filesystem
            # would mean an emptyDir per path plus a configuration change to match -- security
            # theatre with more moving parts than the thing it protects. The JVMs need exactly one
            # writable directory, which is why they get the stronger setting and this does not.
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          # No startup probe: nginx is serving before the kubelet has finished asking. /healthz is
          # a literal 200 from the server configuration rather than a file on disk, so a container
          # whose assets failed to copy reports itself unready instead of serving a 404 page to
          # every viewer.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fleet
  labels:
    app.kubernetes.io/name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Host access on localhost:18080 -- the port this project's README has reserved for the dashboard
# since M0, and the one origin the dashboard API's CORS list has named since S14. It is also the
# port `npm run preview` serves the built assets on, which is what makes that command a rehearsal
# of this deployment rather than a different thing that happens to work.
apiVersion: v1
kind: Service
metadata:
  name: dashboard-external
  namespace: fleet
  labels:
    app.kubernetes.io/name: dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
