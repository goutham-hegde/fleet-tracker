# The application layer: the five services and the page that reads them.
#
# Split from the platform layer above it (Kafka and MongoDB) because the two have completely
# different lifecycles. The platform is stateful, is deployed once and is left alone; these six are
# rebuilt from source and rolled out constantly. Keeping them in separate directories means
# `kubectl apply -k deploy/base/services` is a thing that can be said.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet
resources:
  - platform-endpoints.yaml
  - ingest-gateway.yaml
  - tracking-processor.yaml
  - shipment-service.yaml
  - exception-service.yaml
  - dashboard-api.yaml
  - dashboard.yaml
